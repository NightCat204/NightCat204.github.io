sections:
  - id: research-projects
    title: RESEARCH PROJECTS
    items:
      - title: End-to-End Humanoid Soccer Control via Depth-Based Active Perception
        subtitle: 'Yixiao Huo*, <strong>Pengyuan Wang*</strong>, Jiakang Jin*, Yinan Han*, et al.'
        summary: Developed an end-to-end RL framework for a 25-DOF humanoid to perform complex soccer maneuvers. Integrated depth-based active perception and auxiliary prediction heads for robust sim-to-real hardware deployment.
        image: ./assets/img/1_Dribble_E1_25dof.gif
        notes: ongoing

      - title: Autonomous Humanoid Exploration in Multi-Level Terrains
        subtitle: 'Yinan Han*, Yixiao Huo*, <strong>Pengyuan Wang*</strong>, Jiakang Jin*, et al.'
        summary: Designed a goal-free heuristic exploration policy for a 25-DOF humanoid using active depth sensing. Synthesized competitive reward dynamics to induce emergent, terrain-adaptive locomotion across complex environments.
        image: ./assets/img/2_HMV_Env.PNG
        notes: ongoing

  - id: competitions
    title: COMPETITIONS
    items:
      - title: "RoboMaster University Series: Embedded System Architecture"
        subtitle: 'Zhejiang University RoboMaster Team "Hello World"'
        summary: Architected the embedded software and multi-layer state machines for heterogeneous competitive robots. Developed high-bandwidth bit-field protocols and cascaded PID controllers to ensure deterministic, high-speed motion control.
        image: ./assets/img/3_RM_Infantry.gif
        links:
          - label: Technical Report
            url: ./assets/files/RM2025_无人机电控技术方案.pdf

  - id: engineering-projects
    title: ENGINEERING PROJECTS
    items:
      - title: General Motion Tracking on E1 Humanoid Platform
        subtitle: Internship at Noetix Robotics
        summary: Reproduced and optimized General Motion Tracking frameworks (BeyondMimic/HoloMotion) via Isaac Lab. Leveraged adaptive sampling and robust sim-to-real pipelines to achieve stable whole-body imitation of high-dynamic dance sequences.
        image: ./assets/img/4_Dance_E1.gif

      - title: Agile UAV Flight Control via Deep Reinforcement Learning
        subtitle: Research project at FAST Lab, Zhejiang University
        summary: Built a high-mobility UAV control stack bridging PPO-based RL and cascaded PID. Achieved autonomous agile maneuvers (e.g., figure-8) using extensive domain randomization for robust sim-to-real hardware transfer.
        image: ./assets/img/5_Fly8_UAV.gif
